name: gula-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      GULA_APP_PASSWORD: gula_app
      GULA_DBS: gula_dev gula_test
    ports:
      - '5433:5432'
    volumes:
      - pg_dev:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pg_dev:
